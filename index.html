<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue</title><style>
body {
  font-family: Arial;
  margin:0;
  background:#f5f5f5;
}

/* Search bar */
.search {
  background:#fff;
  padding:10px;
  position:sticky;
  top:0;
  z-index:2;
}
.search input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

/* Category bar */
.topbar {
  display:flex;
  overflow-x:auto;
  background:#fff;
  padding:10px;
}
.topbar div {
  margin-right:10px;
  padding:8px 14px;
  background:#eee;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

/* Product card */
.product {
  background:#fff;
  margin:12px;
  padding:15px;
  border-radius:14px;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

.product img {
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

.product h3 {
  margin:5px 0;
  font-size:18px;
}

.price {
  color:#333;
  font-weight:bold;
}

.box {
  color:#666;
  margin:5px 0;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#000;
  color:#fff;
  font-size:14px;
}

/* Cart bar */
.cartbar {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cartbar button {
  background:#fff;
  color:#000;
}
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 998;
}
/* Cart screen */
.cartscreen {
  position:fixed;
  top:auto;
  bottom:0;
  left:0;
  width:100%;
  height:90%;
  background:#fff;
  overflow:auto;
  display:none;
  padding:15px;
  z-index: 999;
  animation: slideUp 0.3s ease;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}
@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}
input {
  width:100%;
}
  .active {
  background:#000 !important;
  color:#fff;
}

.addbtn {
  background:#28a745;
  color:#fff;
  width:100%;
  margin-top:8px;
  font-weight:bold;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
}

</style></head><body>

<div class="header">
  <h1>RUBY ELECTRICALS</h1>
  <p>Trader & Manufacturer of Electrical Accessories</p>
  <small>Deals in all types of electrical accessories</small>
</div>

<div class="search">
  <input type="text" placeholder="Search products..." onkeyup="searchProduct(this.value)">
</div><div class="topbar" id="categories"></div>
<div id="products"></div><div class="cartbar">
<span id="total">₹0</span>
<button onclick="openCart()">View Order</button>
</div>
  <div id="overlay" onclick="closeCart()"></div>
  <div class="cartscreen" id="cartScreen"></div>
  <script>

let sheetURL = "https://opensheet.elk.sh/1BjnRPnIEpIUAkoQ1tZ8wtQe55xN7APM6nmCV-ta5tCI/Products";

let products = [];
let cart = {};

fetch(sheetURL)
.then(res => res.json())
.then(data => {
  products = data;
  renderCategories();
  renderProducts(products);
});

function renderCategories(){
  let cats = ["All", ...new Set(products.map(p=>p.category))];
  let html="";
  cats.forEach(c=>{
    html += `<div onclick="filterCategory('${c}', this)">${c}</div>`;
  });
  document.getElementById("categories").innerHTML = html;
}

function filterCategory(cat, el){
  document.querySelectorAll('.topbar div').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');

  if(cat=="All"){renderProducts(products); return;}
  renderProducts(products.filter(p=>p.category==cat));
}

function searchProduct(text){
  let filtered = products.filter(p => p.name.toLowerCase().includes(text.toLowerCase()));
  renderProducts(filtered);
}

function renderProducts(list){
  let html="";
  list.forEach(p=>{
    let boxPrice = p.price * p.box_qty;

    html += `
    <div class="product">
      <img src="${p.image_url}">
      <h3>${p.name}</h3>
      <div class="price">₹${p.price}/pc</div>
      <div class="box">Box: ${p.box_qty} pcs → ₹${boxPrice}</div>
      <button class="addbtn" onclick="addToCart(${p.id})">+ Add Box</button>
    </div>`;
  });

  document.getElementById("products").innerHTML = html;
}

function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  updateTotal();
}

function removeItem(id){
  delete cart[id];
  openCart();
  updateTotal();
}

function changeQty(id, change){
  cart[id] += change;
  if(cart[id] <= 0) delete cart[id];
  openCart();
  updateTotal();
}

function updateTotal(){
  let total=0;
  for(let id in cart){
    let p = products.find(x=>x.id==id);
    total += p.price * p.box_qty * cart[id];
  }
  document.getElementById("total").innerText = "₹"+total;
}

function openCart(){
  let html="<h2>Your Order</h2>";

  for(let id in cart){
    let p = products.find(x=>x.id==id);
    let qty = cart[id];
    let pcs = qty * p.box_qty;
    let price = p.price * pcs;

    html += `
    <div>
      <b>${p.name}</b><br>
      ${qty} box (${pcs} pcs) - ₹${price}<br>
      <button onclick="changeQty(${id},1)">+</button>
      <button onclick="changeQty(${id},-1)">-</button>
      <button onclick="removeItem(${id})">Remove</button>
      <hr>
    </div>`;
  }

  html += `
  <button onclick="checkout()">Confirm Order</button>
  <button onclick="closeCart()">Close</button>
  `;

  document.getElementById("cartScreen").innerHTML = html;
  document.getElementById("cartScreen").style.display="block";
}

function closeCart(){
  document.getElementById("cartScreen").style.display="none";
}

function checkout(){
  let html = `
  <h2>Enter Details</h2>
  <input id="shopName" placeholder="Shop Name">
  <input id="mobile" placeholder="Mobile Number">
  <button onclick="sendOrder()">Send Order</button>
  <button onclick="openCart()">Back</button>
  `;

  document.getElementById("cartScreen").innerHTML = html;
}

function sendOrder(){
  let shop = document.getElementById("shopName").value;
  let mobile = document.getElementById("mobile").value;

  if(!shop || !mobile){
    alert("Please fill details");
    return;
  }

  let msg = `Shop: ${shop}\nMobile: ${mobile}\n\nOrder:\n`;
  let total=0;

  for(let id in cart){
    let p = products.find(x=>x.id==id);
    let qty = cart[id];
    let pcs = qty * p.box_qty;
    let price = p.price * pcs;
    total += price;

    msg += `${p.name} - ${qty} box (${pcs} pcs) - ₹${price}\n`;
  }

  msg += `\nTotal: ₹${total}`;

  window.location.href = `whatsapp://send?phone=917859960073&text=${encodeURIComponent(msg)}`;
}

</script></body>
</html>
